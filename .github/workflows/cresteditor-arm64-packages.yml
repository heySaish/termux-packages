name: CrestEditor ARM64 Packages

on:
  push:
    paths:
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      custom_package:
        description: 'Single package name (leave empty to build all matrix packages)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild even if already exists in release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Ek fail hua toh dusre rukaney nahi chahiye
      matrix:
        package:
          - libandroid-support
          - ncurses
          - readline
          - bash
          - busybox
          - coreutils
          - ca-certificates
          - curl
          - git
          - python
          - nodejs
          - nano
          - openssl
          - zlib
          - libffi
          - tar
          - gzip
          - dpkg
          - apt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package filter and release cache
        id: check_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUSTOM="${{ github.event.inputs.custom_package }}"
          PKG="${{ matrix.package }}"
          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"
          TAG_NAME="cresteditor-arm64"

          # 1. Custom package filter check
          if [ -n "$CUSTOM" ] && [ "$CUSTOM" != "$PKG" ]; then
            echo "Skipping $PKG because custom package was requested: $CUSTOM"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Check if source was modified in this push (Auto Trigger)
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "^packages/${PKG}/"; then
              echo "::notice ::Source code for $PKG was modified in this push! Forcing rebuild."
              FORCE="true"
            fi
          fi

          # 3. Create release if it doesn't exist
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" \
            --title "CrestEditor ARM64 Packages" \
            --notes "Prebuilt aarch64 packages for com.cresteditor" || true

          # 4. Auto-exclude if already built in release (and not forced)
          if [ "$FORCE" != "true" ]; then
            if gh release view "$TAG_NAME" --json assets --jq '.assets.[].name' | grep -q "^${PKG}_.*_aarch64\.deb$"; then
              echo "::notice ::Package $PKG already exists in release! Skipping build."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Free Disk Space on Runner
        if: steps.check_status.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Download existing packages cache
        if: steps.check_status.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          gh release download "cresteditor-arm64" -D output --pattern "*_aarch64.deb" || true

      - name: Build Package for aarch64
        if: steps.check_status.outputs.skip != 'true'
        run: |
          ./scripts/run-docker.sh ./build-package.sh --reuse-built-packages -a aarch64 "${{ matrix.package }}"

      - name: Instant Auto-Upload to GitHub Release
        if: steps.check_status.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="cresteditor-arm64"
          if ls output/*.deb 1> /dev/null 2>&1; then
            echo "Uploading built debs to GitHub Release..."
            gh release upload "$TAG_NAME" output/*.deb --clobber
          else
            echo "No .deb generated to upload."
            exit 1
          fi
